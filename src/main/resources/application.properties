server.port=8080
server.address=127.0.0.1
spring.application.name=finance

# Where the bundled PostgreSQL keeps its files (relative to the working directory by default)
finance.data-dir=./data
finance.db-port=54329
# Folder for uploaded debtor photos
finance.photo-dir=./data/photos

# startup speed: no JMX, no banner, don't scan every jar for tag libraries
spring.jmx.enabled=false
spring.main.banner-mode=off
server.tomcat.additional-tld-skip-patterns=*.jar
spring.mvc.log-request-details=false

spring.flyway.enabled=true
# Folder for automatic safety backups taken before a restore
finance.backup-dir=./data/backups

# photos are small, but a backup zip uploaded for restore can be large
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.mvc.format.date=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

